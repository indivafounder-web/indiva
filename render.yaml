# INDIVA on Render
# Blueprint: New → Blueprint → this repo
#
# Data: do NOT rely on the web service disk. Attach one of:
#   A) Turso  — set TURSO_DATABASE_URL + TURSO_AUTH_TOKEN (free)
#   B) Render Postgres — create a PostgreSQL instance, then
#      Environment → Add DATABASE_URL from that instance
#   C) Neon / Supabase — paste their postgres URL into DATABASE_URL

services:
  - type: web
    name: indiva
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false

# Optional paid Postgres on Render. Uncomment if you want Render to
# provision the database and inject DATABASE_URL automatically.
#
# databases:
#   - name: indiva-db
#     plan: basic-256mb
#     databaseName: indiva
#     user: indiva
#
# Then on the web service, replace DATABASE_URL with:
#   - key: DATABASE_URL
#     fromDatabase:
#       name: indiva-db
#       property: connectionString
